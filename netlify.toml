[build]
  command = "echo 'Static site - no build step needed'"
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "https://puzzlerivals.com/*"
  to = "https://www.puzzlerivals.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/Puzzles/*"
  to = "/Puzzles/:splat"
  status = 200

[[redirects]]
  from = "/cosmetics/*"
  to = "/cosmetics/:splat"
  status = 200

[[redirects]]
  from = "/game/*"
  to = "/game/:splat"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
