<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirror Maze Prototype</title>
    <style>
      html, body {
        margin: 0;
        background: #03060a;
        color: #eef8ff;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        justify-content: center;
        padding: 18px;
      }
      canvas {
        width: min(100vw - 36px, 1280px);
        height: auto;
        border-radius: 18px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        background: #04070b;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="840"></canvas>
    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const CELL = 96;
      const GRID_ORIGIN = { x: 168, y: 156 };
      const COLS = 6;
      const ROWS = 5;
      const BOARD_WIDTH = CELL * COLS;
      const BOARD_HEIGHT = CELL * ROWS;

      const DIRS = {
        0: { dc: 0, dr: -1 },
        1: { dc: 1, dr: 0 },
        2: { dc: 0, dr: 1 },
        3: { dc: -1, dr: 0 },
      };

      const centerOf = (col, row) => ({
        x: GRID_ORIGIN.x + col * CELL,
        y: GRID_ORIGIN.y + row * CELL,
      });

      const keyForCell = (col, row) => `${col},${row}`;

      const assets = {
        routing_angled_mirror_sheet_v02: { path: 'public/assets/mirror_maze_main_puzzle_routing_angled_mirror_sheet_idle_v02_v03_sheet.png', fw: 384, fh: 384, count: 4 },
        routing_prism_sheet: { path: 'public/assets/mirror_maze_main_puzzle_routing_prism_sheet_idle_v01_v03_sheet.png', fw: 256, fh: 256, count: 4 },
        routing_blocker_sheet: { path: 'public/assets/mirror_maze_main_puzzle_routing_blocker_sheet_idle_v01_v03_sheet.png', fw: 256, fh: 256, count: 4 },
        board_board_tile_sheet: { path: 'public/assets/mirror_maze_main_puzzle_board_board_tile_sheet_idle_v01_v03_sheet.png', fw: 384, fh: 384, count: 4 },
        board_beam_socket_sheet: { path: 'public/assets/mirror_maze_main_puzzle_board_beam_socket_sheet_idle_v01_v03_sheet.png', fw: 384, fh: 384, count: 4 },
        source_source_emitter: { path: 'public/assets/mirror_maze_main_puzzle_source_source_emitter_pulse_04f_v01_v03_sheet.png', fw: 256, fh: 256, count: 4, fps: 10 },
        target_target_receiver: { path: 'public/assets/mirror_maze_main_puzzle_target_target_receiver_charge_04f_v01_v03_sheet.png', fw: 256, fh: 256, count: 4, fps: 10 },
        beam_traveling_beam_v04: { path: 'public/assets/mirror_maze_main_puzzle_beam_traveling_beam_flow_04f_v04_v03_sheet.png', fw: 256, fh: 256, count: 4, fps: 14 },
        trigger_activator_v04: { path: 'public/assets/mirror_maze_main_puzzle_trigger_activator_loop_06f_v04_v03_sheet.png', fw: 256, fh: 256, count: 6, fps: 12 },
        beam_blocked_impact_v04: { path: 'public/assets/mirror_maze_main_puzzle_beam_blocked_impact_loop_06f_v04_v03_sheet.png', fw: 256, fh: 256, count: 6, fps: 16 },
        beam_prism_split_overlay_v04: { path: 'public/assets/mirror_maze_main_puzzle_beam_prism_split_overlay_loop_06f_v04_v03_sheet.png', fw: 341, fh: 341, count: 6, fps: 14 },
      };

      const images = {};
      const state = {
        sockets: new Set([
          keyForCell(1, 1), keyForCell(2, 1), keyForCell(3, 1),
          keyForCell(1, 2), keyForCell(2, 2), keyForCell(4, 1), keyForCell(4, 2),
        ]),
        primarySource: { col: 0, row: 2, dir: 1 },
        secondarySource: { col: 5, row: 1, dir: 3 },
        target: { col: 1, row: 3 },
        prism: { col: 4, row: 3 },
        activator: { col: 2, row: 4 },
        blocker: { col: 4, row: 4 },
        mirrors: [
          { id: 'mirror-a', col: 2, row: 2, orientation: 1 },
          { id: 'mirror-b', col: 4, row: 1, orientation: 0 },
        ],
        traces: [],
        drag: null,
        status: 'Loading art…',
      };

      function reflect(direction, orientation) {
        const slash = orientation % 2 === 0;
        return slash
          ? ({ 0: 1, 1: 0, 2: 3, 3: 2 })[direction]
          : ({ 0: 3, 3: 0, 2: 1, 1: 2 })[direction];
      }

      function isMirrorOccupying(col, row, ignoreId) {
        return state.mirrors.some((mirror) => mirror.id !== ignoreId && mirror.col === col && mirror.row === row);
      }

      function pieceAt(col, row) {
        const mirror = state.mirrors.find((entry) => entry.col === col && entry.row === row);
        if (mirror) return { kind: 'mirror', mirror };
        if (col === state.target.col && row === state.target.row) return { kind: 'target' };
        if (col === state.prism.col && row === state.prism.row) return { kind: 'prism' };
        if (col === state.activator.col && row === state.activator.row) return { kind: 'activator' };
        if (col === state.blocker.col && row === state.blocker.row) return { kind: 'blocker' };
        return null;
      }

      function pushSegment(segments, from, to, direction) {
        const width = Math.max(18, Math.hypot(to.x - from.x, to.y - from.y));
        if (width <= 2) return;
        segments.push({
          x: (from.x + to.x) * 0.5,
          y: (from.y + to.y) * 0.5,
          width,
          angle: direction === 0 || direction === 2 ? Math.PI / 2 : 0,
        });
      }

      function traceFromSource(col, row, dir) {
        const segments = [];
        const fx = [];
        const visited = new Set();
        let activatorHit = false;
        let targetHit = false;

        function walk(startCol, startRow, direction) {
          let currentCol = startCol;
          let currentRow = startRow;
          let currentDir = direction;
          let previousPoint = centerOf(startCol, startRow);

          for (let step = 0; step < 18; step += 1) {
            const delta = DIRS[currentDir];
            currentCol += delta.dc;
            currentRow += delta.dr;

            if (currentCol < 0 || currentRow < 0 || currentCol >= COLS || currentRow >= ROWS) {
              const edgePoint = {
                x: previousPoint.x + delta.dc * CELL * 0.5,
                y: previousPoint.y + delta.dr * CELL * 0.5,
              };
              pushSegment(segments, previousPoint, edgePoint, currentDir);
              return;
            }

            const stateKey = `${currentCol},${currentRow},${currentDir}`;
            if (visited.has(stateKey)) return;
            visited.add(stateKey);

            const point = centerOf(currentCol, currentRow);
            pushSegment(segments, previousPoint, point, currentDir);
            previousPoint = point;

            const piece = pieceAt(currentCol, currentRow);
            if (!piece) continue;

            if (piece.kind === 'mirror') {
              currentDir = reflect(currentDir, piece.mirror.orientation);
              continue;
            }
            if (piece.kind === 'activator') {
              activatorHit = true;
              continue;
            }
            if (piece.kind === 'target') {
              targetHit = true;
              return;
            }
            if (piece.kind === 'blocker') {
              fx.push({ kind: 'impact', col: currentCol, row: currentRow });
              return;
            }
            if (piece.kind === 'prism') {
              fx.push({ kind: 'split', col: currentCol, row: currentRow });
              const blockedDir = (currentDir + 2) % 4;
              [0, 1, 2, 3].filter((entry) => entry !== blockedDir).forEach((splitDir) => walk(currentCol, currentRow, splitDir));
              return;
            }
          }
        }

        walk(col, row, dir);
        return { segments, fx, activatorHit, targetHit };
      }

      function retrace() {
        const primary = traceFromSource(state.primarySource.col, state.primarySource.row, state.primarySource.dir);
        const traces = [primary];
        if (primary.activatorHit) {
          traces.push(traceFromSource(state.secondarySource.col, state.secondarySource.row, state.secondarySource.dir));
        }
        const targetHit = traces.some((trace) => trace.targetHit);
        state.traces = traces;
        state.status = targetHit
          ? 'Target lit. Secondary route complete.'
          : primary.activatorHit
            ? 'Activator engaged. Route the secondary beam through the prism.'
            : 'Primary beam is live. Use the mirrors to feed the activator.';
      }

      function drawFrame(assetKey, frame, x, y, width, height, alpha = 1, angle = 0) {
        const meta = assets[assetKey];
        const image = images[assetKey];
        if (!image) return;
        const safeFrame = Math.max(0, Math.min(meta.count - 1, frame));
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.drawImage(
          image,
          safeFrame * meta.fw,
          0,
          meta.fw,
          meta.fh,
          -width / 2,
          -height / 2,
          width,
          height,
        );
        ctx.restore();
      }

      function animFrame(assetKey, time) {
        const meta = assets[assetKey];
        if (!meta.fps) return 0;
        return Math.floor(time / 1000 * meta.fps) % meta.count;
      }

      function draw(time) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#07111b';
        roundRect(ctx, 104, 116, BOARD_WIDTH + 128, BOARD_HEIGHT + 84, 24, true);
        ctx.strokeStyle = '#163042';
        ctx.lineWidth = 2;
        roundRect(ctx, 104, 116, BOARD_WIDTH + 128, BOARD_HEIGHT + 84, 24, false);

        ctx.fillStyle = '#06090f';
        roundRect(ctx, 840, 116, 332, BOARD_HEIGHT + 84, 24, true);
        ctx.strokeStyle = '#1d3142';
        roundRect(ctx, 840, 116, 332, BOARD_HEIGHT + 84, 24, false);

        ctx.fillStyle = '#eff8ff';
        ctx.font = '28px Segoe UI';
        ctx.fillText('Mirror Maze Prototype', 150, 74);
        ctx.fillStyle = '#8cadc3';
        ctx.font = '14px Segoe UI';
        ctx.fillText('Drag mirrors onto sockets. Tap a mirror to rotate it. Light the target.', 150, 102);

        ctx.fillStyle = '#f1f8fd';
        ctx.font = '24px Segoe UI';
        ctx.fillText('Prototype Notes', 868, 154);
        drawWrappedText('Objective: route the primary beam into the activator, then use the secondary beam to hit the target through the prism.', 868, 194, 276, 20, '#93b4c8', '14px Segoe UI');
        drawWrappedText('Hints:\n- Mirrors can sit on any glowing socket.\n- Slash and backslash logic alternate as you rotate.\n- The prism splits into every direction except the one it came from.', 868, 322, 276, 19, '#7ca2bb', '13px Segoe UI');
        drawWrappedText(state.status, 868, 510, 276, 28, state.status.startsWith('Target') ? '#b8ffd6' : '#cbf0ff', '20px Segoe UI');

        for (let row = 0; row < ROWS; row += 1) {
          for (let col = 0; col < COLS; col += 1) {
            const { x, y } = centerOf(col, row);
            drawFrame('board_board_tile_sheet', (row + col) % 4, x, y, 88, 88, 0.95);
          }
        }

        for (const socket of state.sockets) {
          const [col, row] = socket.split(',').map(Number);
          const { x, y } = centerOf(col, row);
          drawFrame('board_beam_socket_sheet', (col + row) % 4, x, y, 92, 92, 0.8);
        }

        const primary = centerOf(state.primarySource.col, state.primarySource.row);
        drawFrame('source_source_emitter', animFrame('source_source_emitter', time), primary.x, primary.y, 92, 92, 1);

        const secondary = centerOf(state.secondarySource.col, state.secondarySource.row);
        const secondaryActive = state.traces[0] && state.traces[0].activatorHit;
        drawFrame('source_source_emitter', secondaryActive ? animFrame('source_source_emitter', time) : 0, secondary.x, secondary.y, 92, 92, secondaryActive ? 1 : 0.42);

        const targetPos = centerOf(state.target.col, state.target.row);
        ctx.fillStyle = state.traces.some((trace) => trace.targetHit) ? 'rgba(149,255,189,0.18)' : 'rgba(85,213,255,0.08)';
        ctx.beginPath();
        ctx.arc(targetPos.x, targetPos.y, 46, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = state.traces.some((trace) => trace.targetHit) ? 'rgba(149,255,189,0.55)' : 'rgba(85,213,255,0.18)';
        ctx.lineWidth = 2;
        ctx.stroke();
        drawFrame('target_target_receiver', state.traces.some((trace) => trace.targetHit) ? animFrame('target_target_receiver', time) : 0, targetPos.x, targetPos.y, 92, 92, state.traces.some((trace) => trace.targetHit) ? 1 : 0.84);

        const prismPos = centerOf(state.prism.col, state.prism.row);
        drawFrame('routing_prism_sheet', 0, prismPos.x, prismPos.y, 92, 92, 0.98);

        const activatorPos = centerOf(state.activator.col, state.activator.row);
        drawFrame('trigger_activator_v04', secondaryActive ? animFrame('trigger_activator_v04', time) : 0, activatorPos.x, activatorPos.y, 92, 92, secondaryActive ? 1 : 0.68);

        const blockerPos = centerOf(state.blocker.col, state.blocker.row);
        drawFrame('routing_blocker_sheet', 0, blockerPos.x, blockerPos.y, 92, 92, 0.96);

        state.traces.flatMap((trace) => trace.segments).forEach((segment) => {
          drawFrame('beam_traveling_beam_v04', animFrame('beam_traveling_beam_v04', time), segment.x, segment.y, Math.max(22, segment.width), 18, 1, segment.angle);
        });

        state.traces.flatMap((trace) => trace.fx).forEach((fx) => {
          const pos = centerOf(fx.col, fx.row);
          if (fx.kind === 'split') {
            drawFrame('beam_prism_split_overlay_v04', animFrame('beam_prism_split_overlay_v04', time), pos.x, pos.y, 102, 102, 1);
          } else {
            drawFrame('beam_blocked_impact_v04', animFrame('beam_blocked_impact_v04', time), pos.x, pos.y, 68, 68, 1);
          }
        });

        state.mirrors.forEach((mirror) => {
          const pos = state.drag && state.drag.id === mirror.id ? { x: state.drag.x, y: state.drag.y } : centerOf(mirror.col, mirror.row);
          drawFrame('routing_angled_mirror_sheet_v02', mirror.orientation, pos.x, pos.y, 92, 92, 1);
        });

        requestAnimationFrame(draw);
      }

      function roundRect(context, x, y, width, height, radius, fill) {
        context.beginPath();
        context.moveTo(x + radius, y);
        context.arcTo(x + width, y, x + width, y + height, radius);
        context.arcTo(x + width, y + height, x, y + height, radius);
        context.arcTo(x, y + height, x, y, radius);
        context.arcTo(x, y, x + width, y, radius);
        context.closePath();
        if (fill) context.fill();
        else context.stroke();
      }

      function drawWrappedText(text, x, y, maxWidth, lineHeight, color, font) {
        ctx.fillStyle = color;
        ctx.font = font;
        const paragraphs = text.split('\n');
        let cursorY = y;
        paragraphs.forEach((paragraph) => {
          const words = paragraph.split(' ');
          let line = '';
          words.forEach((word) => {
            const test = line ? `${line} ${word}` : word;
            if (ctx.measureText(test).width > maxWidth && line) {
              ctx.fillText(line, x, cursorY);
              cursorY += lineHeight;
              line = word;
            } else {
              line = test;
            }
          });
          if (line) {
            ctx.fillText(line, x, cursorY);
            cursorY += lineHeight;
          }
        });
      }

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * canvas.width / rect.width,
          y: (event.clientY - rect.top) * canvas.height / rect.height,
        };
      }

      function mirrorAtPoint(x, y) {
        return state.mirrors.find((mirror) => {
          const pos = centerOf(mirror.col, mirror.row);
          return Math.abs(x - pos.x) < 46 && Math.abs(y - pos.y) < 46;
        });
      }

      function closestSocket(x, y, ignoreId) {
        let winner = null;
        let best = Number.POSITIVE_INFINITY;
        for (const socket of state.sockets) {
          const [col, row] = socket.split(',').map(Number);
          if (isMirrorOccupying(col, row, ignoreId)) continue;
          const pos = centerOf(col, row);
          const dist = Math.hypot(x - pos.x, y - pos.y);
          if (dist < best) {
            best = dist;
            winner = { col, row, dist };
          }
        }
        return winner;
      }

      canvas.addEventListener('pointerdown', (event) => {
        const point = canvasPoint(event);
        const mirror = mirrorAtPoint(point.x, point.y);
        if (!mirror) return;
        state.drag = {
          id: mirror.id,
          startX: point.x,
          startY: point.y,
          x: centerOf(mirror.col, mirror.row).x,
          y: centerOf(mirror.col, mirror.row).y,
          moved: false,
        };
        canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!state.drag) return;
        const point = canvasPoint(event);
        state.drag.x = point.x;
        state.drag.y = point.y;
        if (Math.hypot(point.x - state.drag.startX, point.y - state.drag.startY) > 8) {
          state.drag.moved = true;
        }
      });

      canvas.addEventListener('pointerup', (event) => {
        if (!state.drag) return;
        const point = canvasPoint(event);
        const mirror = state.mirrors.find((entry) => entry.id === state.drag.id);
        if (!mirror) {
          state.drag = null;
          return;
        }
        if (!state.drag.moved) {
          mirror.orientation = (mirror.orientation + 1) % 4;
        } else {
          const snap = closestSocket(point.x, point.y, mirror.id);
          if (snap && snap.dist < 64) {
            mirror.col = snap.col;
            mirror.row = snap.row;
          }
        }
        state.drag = null;
        retrace();
      });

      Promise.all(Object.entries(assets).map(([key, meta]) => new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          images[key] = image;
          resolve();
        };
        image.onerror = reject;
        image.src = meta.path;
      }))).then(() => {
        retrace();
        requestAnimationFrame(draw);
      }).catch((error) => {
        state.status = `Asset load failed: ${error}`;
        requestAnimationFrame(draw);
      });
    </script>
  </body>
</html>
