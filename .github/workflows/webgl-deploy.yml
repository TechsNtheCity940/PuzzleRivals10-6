name: Unity WebGL Build and Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 2022.3.21f1 LTS
          targetPlatform: WebGL
          customParameters: -executeMethod BuildScript.PerformWebGLBuild
          buildName: PuzzleRivals
          outputPath: build
          stagingPath: WebGL-Deploy-Staging

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4